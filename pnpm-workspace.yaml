packages:
  - "apps/*"
  - "packages/*"

# pnpm blocks dependency build scripts by default. These are the ones we actually want to
# run: Prisma downloads its query engine, sharp and the Rust-based tooling build binaries.
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
